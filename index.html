<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イジンデン一人回し</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/vs.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-seal">陣</span>
    <div class="brand-text">
      <h1>イジンデン<span class="brand-sub">一人回し</span></h1>
      <p class="brand-tagline">デッキ構築 &amp; ソロプレイ卓上アシスタント</p>
    </div>
  </div>
  <nav class="tabs" id="mainTabs">
    <button class="tab-btn is-active" data-tab="builder">デッキ構築</button>
    <button class="tab-btn" data-tab="solo">ソロプレイ</button>
<button class="tab-btn" data-tab="vs">CPU対戦</button>
  </nav>
</header>

<main id="app">

  <!-- ============ DECK BUILDER ============ -->
  <section id="tab-builder" class="tab-panel is-active">
    <div class="builder-layout">

      <!-- Filters -->
      <aside class="panel filters-panel">
        <h2 class="panel-title">絞り込み</h2>

        <div class="field">
          <label>カード名 / テキスト検索</label>
          <input type="text" id="fSearch" placeholder="例: 剣術, 破壊されない">
        </div>

        <div class="field">
          <label>種類</label>
          <div class="chip-group" id="fType">
            <button class="chip-toggle is-active" data-val="イジン">イジン</button>
            <button class="chip-toggle is-active" data-val="マホウ">マホウ</button>
            <button class="chip-toggle is-active" data-val="ハイケイ">ハイケイ</button>
            <button class="chip-toggle is-active" data-val="マリョク">マリョク</button>
          </div>
        </div>

        <div class="field">
          <label>色</label>
          <div class="chip-group" id="fColor"></div>
        </div>

        <div class="field two-col">
          <div>
            <label>レベル 最小</label>
            <input type="number" id="fLevelMin" min="0" max="12" placeholder="0">
          </div>
          <div>
            <label>レベル 最大</label>
            <input type="number" id="fLevelMax" min="0" max="12" placeholder="12">
          </div>
        </div>

        <div class="field">
          <label>収録弾</label>
          <div class="chip-group" id="fSet"></div>
        </div>

        <div class="field">
          <label>特性</label>
          <div class="chip-group" id="fTrait"></div>
        </div>

        <div class="field">
          <label>レアリティ</label>
          <div class="chip-group" id="fRarity"></div>
        </div>

        <button class="btn btn-ghost btn-block" id="btnResetFilters">絞り込みをリセット</button>
      </aside>

      <!-- Card list -->
      <section class="panel list-panel">
        <div class="list-header">
          <h2 class="panel-title" id="listCount">カード一覧</h2>
          <select id="sortSelect">
            <option value="set_asc">収録弾順（昇順）</option>
            <option value="set_desc">収録弾順（降順）</option>
            <option value="level_asc">レベル順（昇順）</option>
            <option value="level_desc">レベル順（降順）</option>
            <option value="power_asc">パワー順（昇順）</option>
            <option value="power_desc">パワー順（降順）</option>
          </select>
        </div>
        <div class="card-grid" id="cardGrid"></div>
      </section>

      <!-- Deck panel -->
      <aside class="panel deck-panel">
        <h2 class="panel-title">構築中デッキ</h2>
        <div class="deck-status" id="deckStatus"></div>
        <div class="deck-list" id="deckList"></div>

        <div class="deck-actions">
          <input type="text" id="deckNameInput" placeholder="デッキ名">
          <div class="btn-row">
            <button class="btn btn-primary" id="btnSaveDeck">保存</button>
            <button class="btn btn-ghost" id="btnNewDeck">新規</button>
          </div>
          <div class="field">
            <label>保存済みデッキ</label>
            <div class="btn-row">
              <select id="savedDeckSelect"></select>
              <button class="btn btn-ghost" id="btnLoadDeck">読込</button>
              <button class="btn btn-danger" id="btnDeleteDeck">削除</button>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="btnExportDeck">テキスト書出</button>
            <button class="btn btn-ghost" id="btnImportDeck">テキスト読込</button>
          </div>
        </div>
      </aside>
    </div>
  </section>

  <!-- ============ SOLO PLAY ============ -->
  <section id="tab-solo" class="tab-panel">

    <!-- Setup screen -->
    <div class="panel setup-panel" id="setupPanel">
      <h2 class="panel-title">対戦準備</h2>
      <div class="field">
        <label>使用するデッキ</label>
        <select id="soloDeckSelect"></select>
      </div>
      <div class="field">
        <label>先攻 / 後攻</label>
        <div class="chip-group" id="fFirst">
          <button class="chip-toggle is-active" data-val="first">先攻</button>
          <button class="chip-toggle" data-val="second">後攻</button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="btnStartGame">対戦開始（シャッフルして準備）</button>
      <p class="hint-text">山札をシャッフルし、手札6枚とガーディアン4枚を自動で準備します。カードの効果適用はご自身でルールテキストを確認しながら手動で行ってください。</p>
    </div>

    <!-- Board -->
    <div class="board" id="boardPanel" style="display:none;">

      <div class="board-topbar">
        <div class="topbar-main">
        <div class="seal-stamp" id="phaseStamp">
          <span class="seal-turn" id="stampTurn">1</span>
          <span class="seal-phase" id="stampPhase">スタート</span>
        </div>
        <div class="resource-counters">
          <div class="counter"><span class="counter-label">マリョク配置権</span><span class="counter-value" id="cntMana">1</span></div>
          <div class="counter"><span class="counter-label">イジン召喚権</span><span class="counter-value" id="cntSummon">1</span></div>
          <div class="counter"><span class="counter-label">山札</span><span class="counter-value" id="cntDeck">0</span></div>
		  <div class="counter"><span class="counter-label">ドロー(済/上限)</span><span class="counter-value" id="cntDraw">0/0</span></div>
        </div>
        <div class="board-actions">
		  <button class="btn btn-ghost" id="btnUndo" disabled>↩ 一つ戻る</button>
          <button class="btn btn-ghost" id="btnDrawExtra">1枚引く</button>
          <button class="btn btn-primary" id="btnAdvancePhase">次のフェイズへ</button>
          <button class="btn btn-danger" id="btnEndGame">対戦終了</button>
        </div>
        </div>

        <div class="log-panel">
          <h3 class="zone-title">ログ</h3>
          <div class="log-list" id="logList"></div>
        </div>
      </div>

      <div class="board-zones">

        <div class="zone zone-field">
          <h3 class="zone-title">戦場 <span class="zone-count" id="cntField"></span></h3>
          <div class="zone-cards" id="zoneField"></div>
        </div>

        <div class="zone zone-mana">
          <h3 class="zone-title">魔力ゾーン <span class="zone-count" id="cntMana2"></span></h3>
          <div class="mana-summary" id="manaSummary"></div>
          <div class="zone-cards" id="zoneMana"></div>
        </div>

        <div class="zone zone-grave">
          <h3 class="zone-title">墓地 <span class="zone-count" id="cntGrave"></span></h3>
          <div class="zone-cards" id="zoneGrave"></div>
        </div>

        <div class="zone zone-hand">
          <h3 class="zone-title">手札 <span class="zone-count" id="cntHand"></span></h3>
          <div class="zone-cards" id="zoneHand"></div>
        </div>

      </div>

    </div>
  </section>
  <!-- ============ CPU PLAY ============ -->
<section id="tab-vs" class="tab-panel">
  <div class="panel setup-panel" id="vsSetupPanel">
    <h2 class="panel-title">CPU対戦の準備</h2>
    <div class="field"><label>あなたのデッキ</label><select id="vsMyDeck"></select></div>
    <div class="field"><label>CPUのデッキ</label><select id="vsCpuDeck"></select></div>
    <div class="field">
      <label>先攻 / 後攻</label>
      <div class="chip-group" id="vsFirst">
        <button class="chip-toggle is-active" data-val="first">先攻</button>
        <button class="chip-toggle" data-val="second">後攻</button>
        <button class="chip-toggle" data-val="random">ランダム</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="vsStart">対戦開始</button>
    <p class="hint-text">CPUは合法手をランダムに選びます。カード効果は自動処理されないので、手動調整メニューやカード詳細を見ながら進めてください。</p>
  </div>
  <div class="board" id="vsBoard" style="display:none;"></div>
</section>
</main>

<!-- Card detail modal -->
<div class="modal-overlay" id="cardModal">
  <div class="modal-card" id="cardModalContent"></div>
</div>

<!-- Action menu popover (for hand/field/mana cards in solo play) -->
<div class="action-menu" id="actionMenu"></div>

<script src="js/cards-data.js"></script>
<script src="js/preset-decks.js"></script>
<script src="js/summon-rules.js"></script>
<script src="js/glossary.js"></script>
<script src="js/app.js"></script>
<script src="js/vs-engine.js"></script>
<script src="js/vs-ui.js"></script>
</body>
</html>
